<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appleIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6EF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5EE8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#appleIconGradient)"/>

  <!-- Letter "S" -->
  <text x="90" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="bold" fill="white" text-anchor="middle">S</text>
</svg>
