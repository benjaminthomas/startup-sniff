<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6EF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5EE8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Content Group -->
  <g transform="translate(600, 315)">
    <!-- Logo Square -->
    <rect x="-240" y="-80" width="80" height="80" rx="12" fill="white"/>

    <!-- Logo "S" -->
    <text x="-200" y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#2D6EF7" text-anchor="middle" dominant-baseline="middle">S</text>

    <!-- Brand Name -->
    <text x="80" y="-30" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-1">StartupSniff</text>

    <!-- Tagline -->
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="white" fill-opacity="0.95" text-anchor="middle">AI-Powered Startup Ideas &amp; Validation</text>

    <!-- Sub-tagline -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white" fill-opacity="0.85" text-anchor="middle">Discover trending opportunities • Validate with AI • Build with confidence</text>
  </g>
</svg>
